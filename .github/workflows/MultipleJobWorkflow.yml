name: Multiple Job workflow

on:
  push: 
    branches: ["main"]

jobs:


  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Project
      run: |
        echo "Running build job"
        dotnet build

  
  development:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Run development
      run: |
        echo "Running development job"
        dotnet test

  Production:
    runs-on: ubuntu-latest

    steps:
    - name: Production
      run: echo "Deploying Production application"

